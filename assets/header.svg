<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Moustafa Ahmed, backend engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0c1526"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.42" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="0.58" stop-color="#a78bfa"/>
      <stop offset="0.66" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.7 0; 0.7 0; -0.7 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="19.5" fill="none" stroke="#1c2536"/>

  <circle cx="140" cy="20" r="300" fill="url(#glowA)"/>
  <circle cx="1190" cy="340" r="330" fill="url(#glowB)"/>

  <!-- identity -->
  <text x="74" y="150" fill="#22d3ee" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" letter-spacing="7">BACKEND ENGINEER</text>
  <text x="72" y="244" fill="url(#nameFill)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-1.5">Moustafa Ahmed</text>

  <!-- live system graph -->
  <g stroke="#2b3a55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M892 95 H1138" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M886 105 L1006 177" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M1144 105 L1024 177" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M1015 198 V262" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M892 185 H1003" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M880 107 V173" stroke-dasharray="6 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle r="4.5" fill="#22d3ee">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M880 95 L1150 95 L1015 185 L1015 275 L1015 185 L880 185 L880 95"/>
    </circle>
    <circle r="10" fill="#22d3ee" fill-opacity="0.18">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M880 95 L1150 95 L1015 185 L1015 275 L1015 185 L880 185 L880 95"/>
    </circle>

    <g font-family="Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
      <circle cx="880" cy="95" r="13" fill="#0d1526" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="880" cy="95" r="13" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="13;23;13" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="880" y="134" fill="#7c8aa0">api</text>

      <circle cx="1150" cy="95" r="13" fill="#0d1526" stroke="#a78bfa" stroke-width="2.5"/>
      <circle cx="1150" cy="95" r="13" fill="none" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="13;23;13" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <text x="1150" y="134" fill="#7c8aa0">queue</text>

      <circle cx="880" cy="185" r="13" fill="#0d1526" stroke="#34d399" stroke-width="2.5"/>
      <circle cx="880" cy="185" r="13" fill="none" stroke="#34d399" stroke-width="2">
        <animate attributeName="r" values="13;23;13" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="880" y="224" fill="#7c8aa0">cache</text>

      <circle cx="1015" cy="185" r="13" fill="#0d1526" stroke="#fbbf24" stroke-width="2.5"/>
      <circle cx="1015" cy="185" r="13" fill="none" stroke="#fbbf24" stroke-width="2">
        <animate attributeName="r" values="13;23;13" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1015" y="224" fill="#7c8aa0">worker</text>

      <circle cx="1015" cy="275" r="13" fill="#0d1526" stroke="#f472b6" stroke-width="2.5"/>
      <circle cx="1015" cy="275" r="13" fill="none" stroke="#f472b6" stroke-width="2">
        <animate attributeName="r" values="13;23;13" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="1015" y="314" fill="#7c8aa0">mysql</text>
    </g>
  </g>

  <!-- data bus -->
  <line x1="72" y1="326" x2="1240" y2="326" stroke="#16203a" stroke-width="2"/>
  <line x1="72" y1="326" x2="1240" y2="326" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="60 1108" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="1168" to="-60" dur="7s" repeatCount="indefinite"/>
  </line>
  <g fill="#243049">
    <circle cx="200" cy="326" r="3.5"/>
    <circle cx="392" cy="326" r="3.5"/>
    <circle cx="584" cy="326" r="3.5"/>
    <circle cx="776" cy="326" r="3.5"/>
    <circle cx="968" cy="326" r="3.5"/>
    <circle cx="1160" cy="326" r="3.5"/>
  </g>
</svg>

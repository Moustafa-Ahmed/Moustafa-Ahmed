<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Moustafa Ahmed — backend engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="15.5" fill="none" stroke="#1f2937"/>

  <!-- window chrome -->
  <line x1="0" y1="46" x2="1280" y2="46" stroke="#1f2937"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="23" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="23" r="7" fill="#27c93f"/>
  <text x="640" y="28" fill="#5b6472" font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle">moustafa@github: ~</text>

  <!-- whoami -->
  <text x="56" y="106" font-family="Menlo, Consolas, monospace" font-size="24">
    <tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9"> whoami</tspan>
  </text>

  <!-- name -->
  <text x="54" y="182" fill="#f0f6fc" font-family="Menlo, Consolas, monospace" font-size="64" font-weight="700">Moustafa Ahmed</text>

  <!-- role -->
  <text x="58" y="228" font-family="Menlo, Consolas, monospace" font-size="24">
    <tspan fill="#8b949e">backend engineer</tspan>
    <tspan fill="#3b4453">  ·  </tspan>
    <tspan fill="#38bdf8">laravel</tspan>
    <tspan fill="#3b4453">  ·  </tspan>
    <tspan fill="#a78bfa">php</tspan>
    <tspan fill="#3b4453">  ·  </tspan>
    <tspan fill="#f472b6">mysql</tspan>
  </text>

  <!-- prompt -->
  <text x="56" y="272" font-family="Menlo, Consolas, monospace" font-size="24"><tspan fill="#27c93f">$</tspan></text>
  <rect x="80" y="253" width="13" height="23" fill="#c9d1d9"/>
</svg>
